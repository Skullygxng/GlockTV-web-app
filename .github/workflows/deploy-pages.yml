name: Deploy GlockTV web app to GitHub Pages

# Publishes the dist/ build to GitHub Pages. Any static host can serve the same
# `npm run build` output instead; this is the deployment target the site uses.
#
# GitHub Pages serves a project site under /<repository>/, so this build takes
# its base path and public URL from actions/configure-pages rather than from a
# hard-coded path or domain. Pages cannot send custom response headers, so the
# recommended security headers cannot be applied here.
#
# Build configuration: the browser-safe Supabase values and the TMDB key are
# embedded in "Resolve build configuration" as defaults, so the site deploys
# with no repository configuration. Everything VITE_ becomes public in the
# bundle either way; secret TMDB_API_KEY and vars SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY override the embedded defaults when set.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reading the Pages metadata needs Pages to exist; it cannot be enabled
      # from Actions (GITHUB_TOKEN has no administration scope). If Pages is
      # not enabled yet this step is skipped over and the build falls back to
      # the values a project site at this repository name will serve at.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Resolve build configuration
        id: site
        env:
          TMDB_API_KEY_SECRET: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL_VAR: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY_VAR: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # A fresh template carries no credentials of its own: everything comes
          # from THIS repository's secrets and variables (the setup wizard's
          # checklist names them). Until they are set, the build runs but the
          # site has no backend or catalog.
          echo "VITE_TMDB_API_KEY=$TMDB_API_KEY_SECRET" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$SUPABASE_URL_VAR" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY_VAR" >> "$GITHUB_ENV"

          # configure-pages reports the base path without a trailing slash ("/repo"
          # for a project site, "" for a custom domain). Everything below needs one
          # leading and one trailing slash: "/repo/" or "/". Concatenating a slash
          # onto the reported value, as this workflow used to, produced "//repo/",
          # which the build rejects as a URL rather than a path.
          base="${PAGES_BASE_PATH:-OWNER-SITE-NAME}"
          base="/${base#/}"
          echo "base_path=${base%/}/" >> "$GITHUB_OUTPUT"

          url="${PAGES_BASE_URL:-https://OWNER.github.io/OWNER-SITE-NAME}"
          echo "site_url=${url%/}/" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          # Where Pages will serve this build, normalised above. The fallbacks in
          # "Resolve build configuration" match
          # https://skullygxng.github.io/GlockTV-web-app/ — update them if the
          # repository is renamed or moves to a custom domain.
          VITE_BASE_PATH: ${{ steps.site.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.site.outputs.site_url }}
          # Ads are optional and blank by default: empty values mean an
          # unconfigured build, which renders no slot at all. Plug a network in
          # by setting these repository variables (see README, plug-in guide).
          VITE_ADS_SCRIPT_URL: ${{ vars.ADS_SCRIPT_URL }}
          VITE_ADS_ZONE_CONTEXT_RAIL: ${{ vars.ADS_ZONE_CONTEXT_RAIL }}
          VITE_ADS_ZONE_SIDEBAR_BOTTOM: ${{ vars.ADS_ZONE_SIDEBAR_BOTTOM }}
          VITE_ADS_ZONE_IN_FEED: ${{ vars.ADS_ZONE_IN_FEED }}
          VITE_ADS_ZONE_DETAILS_PANEL: ${{ vars.ADS_ZONE_DETAILS_PANEL }}
          VITE_ADS_MAX_PER_SESSION: ${{ vars.ADS_MAX_PER_SESSION }}
          VITE_MOVIE_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/movie/{tmdb_id}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'
          VITE_TV_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/tv/{tmdb_id}/{season_number}/{episode_number}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'
          VITE_BACKUP_MOVIE_EMBED_URL_TEMPLATE: 'https://vidzen.fun/movie/{tmdb_id}'
          VITE_BACKUP_TV_EMBED_URL_TEMPLATE: 'https://vidzen.fun/tv/{tmdb_id}/{season_number}/{episode_number}'
          VITE_CINESRC_MOVIE_EMBED_URL_TEMPLATE: 'https://cinesrc.st/embed/movie/{tmdb_id}?autoplay=true&color=%238b24ed&prioritize=true&continueprompt=false'
          VITE_CINESRC_TV_EMBED_URL_TEMPLATE: 'https://cinesrc.st/embed/tv/{tmdb_id}?s={season_number}&e={episode_number}&autoplay=true&color=%238b24ed&prioritize=true&continueprompt=false'
          VITE_PARTY_MOVIE_EMBED_URL_TEMPLATE: 'https://vidzen.fun/movie/{tmdb_id}'
          VITE_PARTY_TV_EMBED_URL_TEMPLATE: 'https://vidzen.fun/tv/{tmdb_id}/{season_number}/{episode_number}'
          VITE_PARTY_BACKUP_MOVIE_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/movie/{tmdb_id}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'
          VITE_PARTY_BACKUP_TV_EMBED_URL_TEMPLATE: 'https://www.vidcore.org/embed/tv/{tmdb_id}/{season_number}/{episode_number}?autoPlay=true&theme=8B24ED&fullscreenButton=true&title=false'

      - name: Check build output
        run: node scripts/check-build-output.mjs "${{ steps.site.outputs.base_path }}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4